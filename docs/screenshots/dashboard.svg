<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Wedding Desk ダッシュボード</title><desc id="desc">結婚式準備の状況を表示するダッシュボードのサンプル</desc>
  <rect width="1440" height="900" fill="#fafbf9"/>
  <rect width="245" height="900" fill="#fff" stroke="#e2e8e2"/>
  <rect x="35" y="40" width="40" height="40" rx="10" fill="#315e50"/><text x="55" y="70" fill="#fff" text-anchor="middle" font-size="26">w.</text>
  <text x="90" y="58" fill="#263d37" font-family="Georgia, serif" font-size="21" font-weight="600">Wedding Desk</text><text x="90" y="77" fill="#596a61" font-family="Arial" font-size="9">ふたりの準備を、ひとつに。</text>
  <text x="35" y="150" fill="#596a61" font-family="Arial" font-size="10" letter-spacing="2">WORKSPACE</text>
  <rect x="24" y="175" width="195" height="47" rx="7" fill="#f0f4ed"/><rect x="24" y="192" width="3" height="14" rx="2" fill="#315e50"/>
  <text x="48" y="204" fill="#315e50" font-family="Arial" font-size="14" font-weight="600">概要</text><text x="48" y="264" fill="#596a61" font-family="Arial" font-size="14">資料と連絡</text><text x="48" y="319" fill="#596a61" font-family="Arial" font-size="14">やること</text>
  <line x1="35" y1="725" x2="210" y2="725" stroke="#e2e8e2"/><text x="35" y="765" fill="#263d37" font-family="Arial" font-size="13" font-weight="600">ふたりの結婚式</text><text x="35" y="793" fill="#596a61" font-family="Georgia" font-size="13">2026 . 10 . 25</text>
  <g transform="translate(300,55)"><text x="0" y="18" fill="#596a61" font-family="Arial" font-size="10" letter-spacing="2">2026 . 09 . 07 / YOUR WEDDING NOTEBOOK</text><text x="0" y="75" fill="#263d37" font-family="Arial" font-size="34" font-weight="600">準備を、ひとつずつ。</text><text x="0" y="108" fill="#596a61" font-family="Arial" font-size="15">届いた連絡を整理して、今日の一歩を見つけましょう。</text><rect x="970" y="20" width="145" height="49" rx="7" fill="#315e50"/><text x="1042" y="51" fill="#fff" text-anchor="middle" font-family="Arial" font-size="13" font-weight="600">＋ 連絡を登録</text>
  <rect x="0" y="150" width="1115" height="125" rx="12" fill="#f0f4ed" stroke="#e1e8dd"/><text x="30" y="185" fill="#596a61" font-family="Arial" font-size="10" letter-spacing="2">OUR WEDDING</text><text x="30" y="225" fill="#263d37" font-family="Arial" font-size="23" font-weight="600">ふたりの結婚式</text><text x="30" y="251" fill="#596a61" font-family="Arial" font-size="13">会場名 / 2026年10月25日</text><text x="1005" y="195" fill="#596a61" text-anchor="middle" font-family="Arial" font-size="12">大切な日まで</text><text x="1005" y="248" fill="#263d37" text-anchor="middle" font-family="Georgia" font-size="53">48<tspan font-family="Arial" font-size="13"> 日</tspan></text>
  <text x="0" y="325" fill="#596a61" font-family="Arial" font-size="12">確認待ちの候補</text><text x="0" y="368" fill="#263d37" font-family="Arial" font-size="32">3<tspan font-size="12"> 件</tspan></text><text x="0" y="395" fill="#315e50" font-family="Arial" font-size="11">資料を確認する →</text><text x="370" y="325" fill="#596a61" font-family="Arial" font-size="12">これからやること</text><text x="370" y="368" fill="#263d37" font-family="Arial" font-size="32">12<tspan font-size="12"> 件</tspan></text><text x="370" y="395" fill="#315e50" font-family="Arial" font-size="11">タスクを開く →</text><text x="740" y="325" fill="#596a61" font-family="Arial" font-size="12">完了したこと</text><text x="740" y="368" fill="#263d37" font-family="Arial" font-size="32">8<tspan font-size="12"> 件</tspan></text><text x="740" y="395" fill="#315e50" font-family="Arial" font-size="11">進んだことを見る →</text>
  <text x="0" y="455" fill="#596a61" font-family="Arial" font-size="10" letter-spacing="2">NEXT STEPS</text><text x="0" y="488" fill="#263d37" font-family="Arial" font-size="19" font-weight="600">今やること</text><rect x="0" y="510" width="680" height="230" rx="12" fill="#fff" stroke="#e2e8e2"/><text x="30" y="555" fill="#263d37" font-family="Arial" font-size="14">式場へ次回打ち合わせの日程を返信する</text><text x="30" y="585" fill="#596a61" font-family="Arial" font-size="11">期限：9月12日 / 自分</text><rect x="550" y="540" width="85" height="27" rx="5" fill="#fbf3df"/><text x="592" y="558" fill="#7b5a16" text-anchor="middle" font-family="Arial" font-size="10">これから</text><line x1="30" y1="615" x2="650" y2="615" stroke="#e2e8e2"/><text x="30" y="660" fill="#263d37" font-family="Arial" font-size="14">プロフィールムービーの写真を選ぶ</text><text x="30" y="690" fill="#596a61" font-family="Arial" font-size="11">期限：9月18日 / ふたり</text><rect x="550" y="645" width="85" height="27" rx="5" fill="#f1f3f0"/><text x="592" y="663" fill="#596a61" text-anchor="middle" font-family="Arial" font-size="10">これから</text>
  <text x="735" y="455" fill="#596a61" font-family="Arial" font-size="10" letter-spacing="2">INBOX</text><text x="735" y="488" fill="#263d37" font-family="Arial" font-size="19" font-weight="600">最近の資料</text><rect x="735" y="510" width="380" height="230" rx="12" fill="#fff" stroke="#e2e8e2"/><text x="760" y="552" fill="#596a61" font-family="Arial" font-size="10">メール · 09/07 登録</text><text x="760" y="582" fill="#263d37" font-family="Arial" font-size="14">式場からのご連絡</text><rect x="760" y="600" width="75" height="24" rx="5" fill="#fbf3df"/><text x="797" y="616" fill="#7b5a16" text-anchor="middle" font-family="Arial" font-size="10">確認待ち</text><line x1="760" y1="650" x2="1090" y2="650" stroke="#e2e8e2"/><text x="760" y="687" fill="#596a61" font-family="Arial" font-size="10">LINE · 09/06 登録</text><text x="760" y="717" fill="#263d37" font-family="Arial" font-size="14">衣装店との打ち合わせメモ</text></g>
</svg>
