<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Wedding Desk タスク取り込み画面</title><desc id="desc">移行用JSONを選び、内容を確認する画面のサンプル</desc>
  <rect width="1440" height="900" fill="#fafbf9"/><rect width="245" height="900" fill="#fff" stroke="#e2e8e2"/>
  <rect x="35" y="40" width="40" height="40" rx="10" fill="#315e50"/><text x="55" y="70" fill="#fff" text-anchor="middle" font-size="26">w.</text><text x="90" y="58" fill="#263d37" font-family="Georgia, serif" font-size="21" font-weight="600">Wedding Desk</text><text x="90" y="77" fill="#596a61" font-family="Arial" font-size="9">ふたりの準備を、ひとつに。</text><text x="35" y="150" fill="#596a61" font-family="Arial" font-size="10" letter-spacing="2">WORKSPACE</text><text x="48" y="204" fill="#596a61" font-family="Arial" font-size="14">概要</text><text x="48" y="264" fill="#596a61" font-family="Arial" font-size="14">資料と連絡</text><rect x="24" y="285" width="195" height="47" rx="7" fill="#f0f4ed"/><text x="48" y="315" fill="#315e50" font-family="Arial" font-size="14" font-weight="600">やること</text>
  <g transform="translate(300,55)"><text x="0" y="25" fill="#315e50" font-family="Arial" font-size="13">← やること</text><text x="0" y="95" fill="#263d37" font-family="Arial" font-size="34" font-weight="600">タスクを取り込む</text><text x="0" y="130" fill="#596a61" font-family="Arial" font-size="15">移行用JSONから、開始日・期限・状態・メモを取り込みます。</text><rect x="0" y="180" width="800" height="155" rx="12" fill="#fff" stroke="#e2e8e2"/><rect x="30" y="210" width="740" height="68" rx="8" fill="#f5f6ef" stroke="#e4e7d7"/><text x="55" y="242" fill="#263d37" font-family="Arial" font-size="13" font-weight="600">Excelから準備した「import_candidates.json」を選んでください。</text><text x="55" y="266" fill="#596a61" font-family="Arial" font-size="12">取り込むのはタスクのみです。ゲスト・収支・BGMはこの操作では登録されません。</text><text x="30" y="310" fill="#263d37" font-family="Arial" font-size="12" font-weight="600">移行用JSON（2MB以下・500件まで）</text><rect x="30" y="355" width="470" height="48" rx="6" fill="#fff" stroke="#d7dfd7"/><text x="48" y="386" fill="#596a61" font-family="Arial" font-size="13">import_candidates.json</text><rect x="525" y="355" width="180" height="48" rx="7" fill="#315e50"/><text x="615" y="385" fill="#fff" text-anchor="middle" font-family="Arial" font-size="13" font-weight="600">内容を確認する</text><text x="0" y="485" fill="#263d37" font-family="Arial" font-size="20" font-weight="600">最近の取り込み</text><rect x="0" y="520" width="800" height="74" rx="10" fill="#fff" stroke="#e2e8e2"/><text x="28" y="551" fill="#263d37" font-family="Arial" font-size="13">2026/09/07 12:20 · 45件 · 確認待ち</text><text x="28" y="576" fill="#596a61" font-family="Arial" font-size="11">内容を確認してから登録できます</text></g>
</svg>
