<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Wedding Desk 連絡の確認画面</title><desc id="desc">保存した原文とAIが見つけたタスク候補を確認する画面のサンプル</desc>
  <rect width="1440" height="900" fill="#fafbf9"/><rect x="50" y="38" width="1340" height="824" rx="14" fill="#fff" stroke="#e2e8e2"/>
  <text x="100" y="95" fill="#315e50" font-family="Arial" font-size="13">← 資料と連絡</text><text x="100" y="155" fill="#596a61" font-family="Arial" font-size="10" letter-spacing="2">メール / 受信</text><text x="100" y="202" fill="#263d37" font-family="Arial" font-size="30" font-weight="600">式場からのご連絡</text><text x="100" y="235" fill="#596a61" font-family="Arial" font-size="13">2026年9月7日 10:20 の連絡 / 09/07 登録</text><rect x="1160" y="170" width="160" height="48" rx="7" fill="#fff" stroke="#d5dfd5"/><text x="1240" y="200" fill="#263d37" text-anchor="middle" font-family="Arial" font-size="13">やること一覧 →</text>
  <text x="100" y="300" fill="#596a61" font-family="Arial" font-size="10" letter-spacing="2">SOURCE</text><text x="100" y="335" fill="#263d37" font-family="Arial" font-size="19" font-weight="600">届いた原文</text><rect x="100" y="360" width="535" height="395" rx="10" fill="#fffefb" stroke="#e2e8e2"/><text x="130" y="405" fill="#263d37" font-family="Arial" font-size="14">いつもお世話になっております。</text><text x="130" y="440" fill="#263d37" font-family="Arial" font-size="14">次回のお打ち合わせについて、</text><text x="130" y="475" fill="#263d37" font-family="Arial" font-size="14">9月12日までに候補日をお知らせください。</text><text x="130" y="530" fill="#263d37" font-family="Arial" font-size="14">持ち物：招待状の文面案、席次表の希望</text><text x="130" y="700" fill="#596a61" font-family="Arial" font-size="12">原文はいつでもここから確認できます。</text>
  <text x="700" y="300" fill="#596a61" font-family="Arial" font-size="10" letter-spacing="2">REVIEW &amp; CONFIRM</text><text x="700" y="335" fill="#263d37" font-family="Arial" font-size="19" font-weight="600">やることの候補</text><rect x="1175" y="313" width="145" height="28" rx="5" fill="#fbf3df"/><text x="1248" y="332" fill="#7b5a16" text-anchor="middle" font-family="Arial" font-size="11">2件を確認</text>
  <rect x="700" y="360" width="620" height="168" rx="10" fill="#fff" stroke="#e2e8e2"/><text x="730" y="395" fill="#596a61" font-family="Arial" font-size="11">候補 01</text><text x="730" y="430" fill="#263d37" font-family="Arial" font-size="16" font-weight="600">次回打ち合わせの候補日を返信する</text><text x="730" y="465" fill="#596a61" font-family="Arial" font-size="12">期限：2026/09/12　担当：自分</text><rect x="730" y="480" width="105" height="30" rx="6" fill="#315e50"/><text x="782" y="500" fill="#fff" text-anchor="middle" font-family="Arial" font-size="11">確認して追加</text>
  <rect x="700" y="550" width="620" height="168" rx="10" fill="#fff" stroke="#e2e8e2"/><text x="730" y="585" fill="#596a61" font-family="Arial" font-size="11">候補 02</text><text x="730" y="620" fill="#263d37" font-family="Arial" font-size="16" font-weight="600">招待状の文面案を準備する</text><text x="730" y="655" fill="#596a61" font-family="Arial" font-size="12">期限：未設定　担当：ふたり</text><rect x="730" y="670" width="105" height="30" rx="6" fill="#315e50"/><text x="782" y="690" fill="#fff" text-anchor="middle" font-family="Arial" font-size="11">確認して追加</text>
</svg>
