# Use only behind a TLS reverse proxy. No public host binding is added here.
services:
  web:
    volumes: !reset []
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://wedding:${DB_PASSWORD}@db/wedding_desk_production
      APP_HOST: ${APP_HOST:-localhost}
    restart: unless-stopped
  worker:
    volumes: !reset []
    environment:
      RAILS_ENV: production
      DATABASE_URL: postgres://wedding:${DB_PASSWORD}@db/wedding_desk_production
      APP_HOST: ${APP_HOST:-localhost}
    restart: unless-stopped
  db:
    restart: unless-stopped
